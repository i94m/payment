[project]
name = "pay-gateway"
version = "0.1.0"
description = "聚合支付网关：商户开放 API + 插件化上游对接"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "alembic>=1.14.0",
    "annotated>=0.0.2",
    "saq>=0.26.0",
    "bcrypt>=4.0.0",
    "Pillow>=11.0.0",
    "fastapi-limiter>=0.1.6",
    "fastapi-pagination>=0.15.4",
    "fastapi[standard]>=0.118.0",
    "asyncmy>=0.2.10",
    "openpyxl>=3.1.0",
    "rich>=13.0.0",
    "typer>=0.12.0",
    "pydantic-settings>=2.11.0",
    "PyJWT>=2.8.0",
    "python-multipart>=0.0.20",
    "python-ulid>=3.1.0",
    "redis>=6.4.0",
    "sqlmodel>=0.0.25",
    "user-agents>=2.2.0",
    "pycryptodome>=3.23.0",
    "cryptography>=48.0.0",
    "httpx>=0.28.1",
    "qrcode>=8.2",
    "pyotp>=2.9.0",
    "aiosmtplib>=5.1.0",
]

[dependency-groups]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.24.0",
    "aiosqlite>=0.20.0",
    # SQLAlchemy 2.0 的 greenlet 依赖带 platform_machine 环境标记，只列了 aarch64，
    # 而 macOS Apple Silicon 报的是 arm64 —— 本地不会自动装，async 引擎/测试直接崩。
    # （此前是被 playwright 顺带装进来的；生产 linux 镜像靠标记即可满足。）
    "greenlet>=3.0",
    # 源码保护编译用（scripts/compile_backend.py，仅容器 builder 阶段实际执行）
    "cython==3.3.*",
]
# 浏览器端到端冒烟（scripts/e2e_smoke.py）专用：非默认组，`uv sync` 不装
# （包 145MB + 浏览器缓存 586MB）。需要时：
#   uv sync --group e2e && uv run playwright install chromium
#   uv run --group e2e python scripts/e2e_smoke.py
e2e = [
    "playwright>=1.63.0",
]

[[tool.uv.index]]
url = "https://mirrors.aliyun.com/pypi/simple"
default = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
