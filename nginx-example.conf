# ============================================================
# pay-gateway 主机 nginx 反向代理示例（nginx 跑在宿主机，非容器）
#
# 用法：
#   sudo cp nginx-example.conf /etc/nginx/conf.d/pay-gateway.conf
#   sudo nginx -t && sudo systemctl reload nginx
#
# 上游对应 docker-compose-example.yml：app 实例端口只绑 127.0.0.1:8000-8002，
# 多实例启动：docker compose up -d --scale app=3
# 实例数与 upstream 列表不必一致 —— 连不上的端口会被 max_fails 自动摘除
# ============================================================

upstream pay_gateway {
    # 默认轮询已够用；请求耗时差异大（支付回调/导出 vs 普通查询）可换 least_conn
    # least_conn;
    server 127.0.0.1:8000 max_fails=3 fail_timeout=10s;
    server 127.0.0.1:8001 max_fails=3 fail_timeout=10s;
    server 127.0.0.1:8002 max_fails=3 fail_timeout=10s;
    keepalive 32;                    # 到上游的长连接池，省掉每请求 TCP 握手
}

server {
    listen 80;
    server_name pay.example.com;     # 换成实际域名；暂无域名用 _

    # 应用上传策略默认 10MB，给点余量；有更大附件再调
    client_max_body_size 20m;

    access_log /var/log/nginx/pay-gateway.access.log;
    error_log  /var/log/nginx/pay-gateway.error.log;

    # 可选：SPA/文档静态资源压缩（若 nginx.conf 全局已开 gzip 可删）
    # gzip on;
    # gzip_types text/css application/javascript application/json image/svg+xml;
    # gzip_min_length 1k;

    location / {
        proxy_pass http://pay_gateway;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # 清空 Connection 头 + HTTP/1.1 = 复用 upstream keepalive 长连接
        # （将来加 websocket 路由再换成 map $http_upgrade $connection_upgrade 方案）
        proxy_set_header Connection        "";

        # 实例宕机快速切换：2s 连接失败即判死，流量转发其余实例
        proxy_connect_timeout 2s;
        proxy_send_timeout    30s;
        proxy_read_timeout    60s;    # 支付跳转/导出等长请求按需调大
        proxy_next_upstream error timeout http_502 http_503 http_504;
        # POST 默认不会重试到下一实例（nginx 1.9.13+ 对非幂等请求的保护），
        # 所以下单不会被双发；如需强制重试 POST 再加 non_idempotent（慎用）
    }
}

