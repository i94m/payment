# 只在「发版」时构建镜像并发布到 ghcr.io —— 普通提交（含 push 到 main）不构建。
#
# 前置说明：dist 不入库（见 .gitignore），与 scripts/build-image.sh 一致，
# 此处在 CI 现场构建前端与文档产物，再交给 Dockerfile（内含入口完整性守护）。
# 后端源码保护：Dockerfile builder 阶段自动将 app/ + plugins/ 编译为 .so
#（含构建期冒烟与无源码守护），CI 无需任何额外步骤；本地开发不编译。
#
# 产物标签（ghcr.io/<owner>/<仓库名小写>）：
#   push tag v1.2.3     → 1.2.3 / 1.2 / 1 / latest / sha-xxxxxxx
#   手动 dispatch 填版本 → <版本> / sha-xxxxxxx（勾了 update_latest 才加 latest）
#   手动 dispatch 不填   → 仅 sha-xxxxxxx（应急重建）
# 版本号必须递增：已有 v1.0.2 时再推 v1.0.1 会直接失败，避免 1.0/1/latest 回退；
# 预发布标签（v1.2.3-rc1）不动 latest，也不影响随后同号正式版的发布。
# 老版本标签不会消失，服务器可长期固定在 1.2.3 这样的精确版本上。
#
# 权限：GITHUB_TOKEN 自动具备（packages: write），无需额外配置 secrets。
name: docker-image

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      version:
        description: '版本标签（如 1.2.3，仅手动构建用；留空则只打 sha 标签）'
        required: false
      update_latest:
        description: '同时把 latest 指向本次版本（补发旧版本时别勾）'
        type: boolean
        default: false

# 同一分支/标签只保留最新一次构建
concurrency:
  group: docker-image-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  packages: write

env:
  REGISTRY: ghcr.io

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # 版本顺序校验需要仓库里全部 tag（默认浅克隆只取当前 ref）
          fetch-depth: 0

      # 版本号校验：tags 触发时必须是 v<major>.<minor>.<patch>（可带预发布后缀），
      # 否则 metadata-action 的 semver 规则一条都不命中，只会留下 sha 标签的镜像；
      # 再校验「不回退」——已有 v1.0.2 时再推 v1.0.1 直接失败，避免 1.0/latest 回退。
      - name: 校验版本标签
        env:
          EVENT: ${{ github.event_name }}
          VERSION_INPUT: ${{ inputs.version }}
          UPDATE_LATEST: ${{ inputs.update_latest }}
        run: |
          if [ "$EVENT" = "workflow_dispatch" ]; then
            shown="$VERSION_INPUT"
            src="手动输入"
          else
            shown="${GITHUB_REF_NAME}"
            src="git 标签"
          fi
          if [ -z "$shown" ]; then
            if [ "$UPDATE_LATEST" = "true" ]; then
              echo "::error::勾选了「同时更新 latest」但没填版本号"
              exit 1
            fi
            echo "::notice::手动构建未填版本号，只发布 sha 标签镜像"
            exit 0
          fi
          ver="${shown#v}"
          semver='^[0-9]+\.[0-9]+\.[0-9]+([-+][0-9A-Za-z.-]+)?$'
          if ! printf '%s' "$ver" | grep -Eq "$semver"; then
            echo "::error::${src} '${shown}' 不是 v<major>.<minor>.<patch> 形式（如 v1.2.3）"
            exit 1
          fi

          # 与仓库内已有版本比较；相等视为重跑，放行。
          # 仅对 tag push 生效：手动 dispatch 是人工显式操作，允许补发/重发任意版本
          highest=""
          if [ "$EVENT" != "workflow_dispatch" ]; then
            highest="$(python3 scripts/ci_version_check.py "$ver" --git-tags)" || exit 1
          fi
          echo "版本号校验通过：${ver}（仓库内已有最高：${highest:-未检查}）"

      # ---- 前端与文档构建（对应 build-image.sh 第 1 步）----
      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: |
            resources/console/pnpm-lock.yaml
            resources/docs/pnpm-lock.yaml

      # 产物（static/console、static/docs）按源码哈希缓存：只改后端的 push 直接恢复
      # 产物、跳过 pnpm 构建；未命中时两个构建后台并行（各自捕获失败，wait 后汇总退出码）
      - uses: actions/cache@v4
        id: console-cache
        with:
          path: static/console
          key: console-${{ hashFiles('resources/console/**') }}

      - uses: actions/cache@v4
        id: docs-cache
        with:
          path: static/docs
          key: docs-${{ hashFiles('resources/docs/**') }}

      - name: 构建前端与文档（缓存未命中时并行）
        run: |
          pids=()
          if [ "${{ steps.console-cache.outputs.cache-hit }}" != "true" ]; then
            (cd resources/console && pnpm install --frozen-lockfile && pnpm build) &
            pids+=($!)
          fi
          if [ "${{ steps.docs-cache.outputs.cache-hit }}" != "true" ]; then
            (cd resources/docs && pnpm install --frozen-lockfile && pnpm build) &
            pids+=($!)
          fi
          # 裸 wait 不回传后台失败码（且 "|| fail=1 &" 的赋值发生在子 shell）：逐 PID wait 汇总
          fail=0
          for pid in "${pids[@]}"; do
            wait "$pid" || fail=1
          done
          exit $fail

      - name: 前端/文档产物完整性守护
        run: |
          test -f static/console/index.html
          test -f static/console/admin.html
          test -f static/console/agent.html
          test -f static/docs/guide/protocol.html

      # ---- ccache：跨 run 复用 Cython 目标码（经 context 拷入 builder，见 Dockerfile）----
      # 失败/取消的 run 不保存（actions/cache post 默认 success() 才执行）；首次冷启全量编译
      - uses: actions/cache@v4
        id: ccache-cache
        with:
          path: .ci-ccache
          key: ccache-${{ github.sha }}
          restore-keys: ccache-
      # 冷启时目录不存在，builder 的 context COPY 需要它存在
      - run: mkdir -p .ci-ccache

      # ---- Docker 构建 & 推送 ghcr.io（仅 amd64）----
      # 生产服务器为 x86；arm64 需 QEMU 模拟构建（慢 5-20 倍，Cython 编译是大头），
      # 已砍掉。Apple Silicon 本地测试由 Docker Desktop 的 Rosetta 模拟运行 amd64
      # 镜像（compose 已固定 platform: linux/amd64，pull 自动选架构）。
      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # 构建时间戳（build-arg 无法在 with: 里跑 shell，先算好再用）
      - name: 构建元信息
        id: buildinfo
        run: echo "created=$(date -u +%Y-%m-%dT%H:%M:%SZ)" >> "$GITHUB_OUTPUT"

      # 标签规则：版本标签走 semver（1.2.3 / 1.2 / 1）；手动构建填了版本号就原样打，
      # latest 只在发版（tag push 或手动填版本）时更新，不再跟随 main 分支提交。
      # 注意：tags: | 里的内容会原样交给 metadata-action，不能写行内注释。
      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ github.repository }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern={{major}}
            type=raw,value=${{ inputs.version }},enable=${{ inputs.version != '' }}
            type=raw,value=latest,enable=${{ (startsWith(github.ref, 'refs/tags/v') && !contains(github.ref_name, '-')) || inputs.update_latest == true }}
            type=sha,prefix=sha-

      - uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64
          # 显式指定最终阶段：不带 target 时 buildkit 默认构建 Dockerfile 的最后
          # 一个阶段，会把 ccache-export（scratch 缓存包）当正式镜像发布
          target: runtime
          push: true
          # 版本元信息写进镜像：ENV 供 /health 与后台系统信息读取，LABEL 供 docker inspect
          #（steps.meta.outputs.version = 主标签，即 1.2.3 / sha-xxxxxxx / 1.0.1）
          build-args: |
            APP_VERSION=${{ steps.meta.outputs.version }}
            APP_REVISION=${{ github.sha }}
            APP_BUILD_DATE=${{ steps.buildinfo.outputs.created }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          # attestation manifest 对此镜像无用途，关闭以减少 push 体积与时间
          provenance: false

      # 从 builder 提取更新后的 ccache 回写 workspace（ccache-export 阶段只含缓存
      # 目录本身）；builder 各层全部命中本机 buildkit 缓存，仅导出耗时。actions/cache
      # 的 post 步骤负责保存。cp 覆盖旧内容即可，ccache 自带容量淘汰
      - name: 导出 ccache 供下次构建复用
        run: |
          docker buildx build --target ccache-export --output type=local,dest=/tmp/ccache-out .
          mkdir -p .ci-ccache
          cp -a /tmp/ccache-out/ccache/. .ci-ccache/

      - name: 输出镜像地址
        run: |
          echo "已发布：" >> $GITHUB_STEP_SUMMARY
          for t in $(echo "${{ steps.meta.outputs.tags }}" | tr '\n' ' '); do
            echo "- \`$t\`" >> $GITHUB_STEP_SUMMARY
          done
