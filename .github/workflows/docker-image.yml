# 推送到 GitHub 后自动构建镜像并发布到 ghcr.io
#
# 前置说明：dist 不入库（见 .gitignore），与 scripts/build-image.sh 一致，
# 此处在 CI 现场构建前端与文档产物，再交给 Dockerfile（内含入口完整性守护）。
# 后端源码保护：Dockerfile builder 阶段自动将 app/ + plugins/ 编译为 .so
#（含构建期冒烟与无源码守护），CI 无需任何额外步骤；本地开发不编译。
#
# 产物标签（ghcr.io/<owner>/<仓库名小写>）：
#   push 到 main  → main / latest / sha-xxxxxxx
#   push tag v1.2.3 → 1.2.3 / 1.2 / sha-xxxxxxx
#
# 权限：GITHUB_TOKEN 自动具备（packages: write），无需额外配置 secrets。
name: docker-image

on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

# 同一分支/标签只保留最新一次构建
concurrency:
  group: docker-image-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  packages: write

env:
  REGISTRY: ghcr.io

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # ---- 前端与文档构建（对应 build-image.sh 第 1 步）----
      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: |
            resources/backend/pnpm-lock.yaml
            resources/docs/pnpm-lock.yaml

      - name: 构建前端 (resources/backend → static/frontend)
        run: |
          cd resources/backend
          pnpm install --frozen-lockfile
          pnpm build
          test -f ../../static/frontend/index.html
          test -f ../../static/frontend/admin.html

      - name: 构建对接文档 (resources/docs → static/docs)
        run: |
          cd resources/docs
          pnpm install --frozen-lockfile
          pnpm build
          test -f ../../static/docs/guide/protocol.html

      # ---- Docker 构建 & 推送 ghcr.io（仅 amd64）----
      # 生产服务器为 x86；arm64 需 QEMU 模拟构建（慢 5-20 倍，Cython 编译是大头），
      # 已砍掉。Apple Silicon 本地测试由 Docker Desktop 的 Rosetta 模拟运行 amd64
      # 镜像（compose 已固定 platform: linux/amd64，pull 自动选架构）。
      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ github.repository }}
          tags: |
            type=ref,event=branch
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest,enable={{is_default_branch}}
            type=sha,prefix=sha-

      - uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: 输出镜像地址
        run: |
          echo "已发布：" >> $GITHUB_STEP_SUMMARY
          for t in $(echo "${{ steps.meta.outputs.tags }}" | tr '\n' ' '); do
            echo "- \`$t\`" >> $GITHUB_STEP_SUMMARY
          done
