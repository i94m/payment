# ============================================================
# pay-gateway 宝塔(BT Panel)站点配置 —— 反向代理到本机 app 容器
#
# 用法（宝塔）：
#   1. 宝塔「网站」→ 添加站点：域名填你的域名（如 pay.example.com），PHP 版本选「纯静态」
#   2. 打开该站点「配置文件」，全选清空后粘贴本文件全部内容
#   3. 把本文件里的 pay.example.com 全部替换为你的域名（server_name / root / 日志）
#   4. 保存（宝塔会自动执行 nginx 配置检查）；需要 HTTPS 时在站点设置里申请证书
#
# 说明：
#   - 业务请求全部反向代理到 app 容器；站点根目录仅用于宝塔 SSL 文件验证
#   - 域名可在宝塔「域名管理」随时增删改（改完把本文件里的域名同步替换即可）
#   - upstream 名 pay_gateway 是全局唯一的：同机部署多套支付栈时改成各自独立的名字
#   - 端口对应 .env 的 APP_PORT_RANGE（默认 8000-8002）；app 实例数少于端口数没关系，
#     连不上的实例会被 max_fails 自动摘除
#   - 非宝塔环境：把 /www/wwwroot、/www/wwwlogs 换成实际路径，放到
#     /etc/nginx/conf.d/pay-gateway.conf 后 `nginx -t && systemctl reload nginx`
# ============================================================

upstream pay_gateway {
    # 默认轮询已够用；耗时差异大（回调/导出 vs 普通查询）可换 least_conn
    # least_conn;
    server 127.0.0.1:8000 max_fails=3 fail_timeout=10s;
    server 127.0.0.1:8001 max_fails=3 fail_timeout=10s;
    server 127.0.0.1:8002 max_fails=3 fail_timeout=10s;
    keepalive 32;                    # 到上游的长连接池，省掉每请求 TCP 握手
}

server {
    listen 80;
    server_name pay.example.com;     # ← 改成你的域名

    # 站点根目录：仅用于宝塔 SSL 证书文件验证（业务请求全部走下面的反向代理）
    root /www/wwwroot/pay.example.com;   # ← 改成宝塔站点实际根目录
    index index.html;

    # 应用上传策略默认 10MB，给点余量；有更大附件再调
    client_max_body_size 20m;

    #SSL-START SSL相关配置，请勿删除或修改下一行带注释的404规则
    #error_page 404/404.html;
    #SSL-END

    #REWRITE-START URL重写规则引用,修改后将导致面板设置的伪静态规则失效
    #REWRITE-END

    # 宝塔申请 SSL 证书的验证目录（文件验证）
    location ^~ /.well-known/ {
        allow all;
        try_files $uri =404;
    }

    # 业务请求：反向代理到 app 容器
    location / {
        proxy_pass http://pay_gateway;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # 清空 Connection 头 + HTTP/1.1 = 复用 upstream keepalive 长连接
        proxy_set_header Connection        "";

        # 实例宕机快速切换：2s 连接失败即判死，流量转发其余实例
        proxy_connect_timeout 2s;
        proxy_send_timeout    60s;
        proxy_read_timeout    60s;   # 支付跳转/导出等长请求按需调大
        proxy_next_upstream error timeout http_502 http_503 http_504;
        # POST 默认不会重试到下一实例（nginx 1.9.13+ 对非幂等请求的保护），
        # 所以下单不会被双发；如需强制重试 POST 再加 non_idempotent（慎用）
    }

    access_log /www/wwwlogs/pay.example.com.log;
    error_log  /www/wwwlogs/pay.example.com.error.log;
}
